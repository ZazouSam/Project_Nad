name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download binaries
        run: node scripts/download-bins.mjs

      - name: Generate icon.ico
        run: magick build/music-note.png -define icon:auto-resize=256,128,64,48,32,16 build/icon.ico

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win -- --publish always

  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download yt-dlp (macOS)
        run: |
          mkdir -p resources/bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos \
            -o resources/bin/yt-dlp_macos
          chmod +x resources/bin/yt-dlp_macos

      - name: Generate icon.icns
        run: |
          mkdir -p /tmp/icon.iconset
          sips -z 16   16   build/music-note.png --out /tmp/icon.iconset/icon_16x16.png
          sips -z 32   32   build/music-note.png --out /tmp/icon.iconset/icon_16x16@2x.png
          sips -z 32   32   build/music-note.png --out /tmp/icon.iconset/icon_32x32.png
          sips -z 64   64   build/music-note.png --out /tmp/icon.iconset/icon_32x32@2x.png
          sips -z 128  128  build/music-note.png --out /tmp/icon.iconset/icon_128x128.png
          sips -z 256  256  build/music-note.png --out /tmp/icon.iconset/icon_128x128@2x.png
          sips -z 256  256  build/music-note.png --out /tmp/icon.iconset/icon_256x256.png
          sips -z 512  512  build/music-note.png --out /tmp/icon.iconset/icon_256x256@2x.png
          sips -z 512  512  build/music-note.png --out /tmp/icon.iconset/icon_512x512.png
          sips -z 1024 1024 build/music-note.png --out /tmp/icon.iconset/icon_512x512@2x.png
          iconutil -c icns /tmp/icon.iconset -o build/icon.icns

      - name: Build universal ffmpeg (arm64 + x64 via lipo)
        run: |
          # arm64 slice — native on this runner
          brew install ffmpeg
          cp $(which ffmpeg) /tmp/ffmpeg-arm64

          # x64 (Intel) slice from evermeet.cx
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o /tmp/ffmpeg-x64.zip
          unzip -o /tmp/ffmpeg-x64.zip -d /tmp/ffmpeg-x64-dir

          # Verify what we downloaded
          echo "arm64 slice arch:"; lipo -archs /tmp/ffmpeg-arm64
          echo "x64 slice arch:";   lipo -archs /tmp/ffmpeg-x64-dir/ffmpeg

          # Stitch into a real fat binary
          lipo -create /tmp/ffmpeg-arm64 /tmp/ffmpeg-x64-dir/ffmpeg \
            -output resources/bin/ffmpeg
          chmod +x resources/bin/ffmpeg
          echo "Universal binary arch:"; lipo -archs resources/bin/ffmpeg

      - name: Build and publish (universal)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build:mac -- --publish always

